<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M5 Metro Servis Takip ve Uyarı Sistemi</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#5c315c">
    <link rel="apple-touch-icon" href="icon-192.png">
    <style>
        :root {
            --bg-color: #f5f0f5;
            --panel-bg: #ffffff;
            --text-color: #333333;
            --m5-purple: #5c315c;
            --m5-purple-dark: #432343;
            --card-bg: #faf6fa;
            --border-color: #e0d0e0;
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --panel-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --m5-purple: #9b59b6;
            --m5-purple-dark: #8e44ad;
            --card-bg: #2a2a2a;
            --border-color: #444444;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            transition: background 0.3s, color 0.3s;
        }

        .container {
            max-width: 650px;
            width: 100%;
            text-align: center;
        }

        /* Üst Kontroller ve Rozet */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .status-badge {
            background: #27ae60;
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 2px 5px rgba(39, 174, 96, 0.3);
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: #fff;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 1; }
            50% { transform: scale(1.4); opacity: 0.4; }
            100% { transform: scale(0.95); opacity: 1; }
        }

        .settings-bar {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .control-btn {
            background: var(--panel-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
        }

        .control-btn:hover {
            opacity: 0.9;
        }

        /* Ana Panel */
        #info-panel {
            background: var(--panel-bg);
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
            border-top: 8px solid var(--m5-purple);
            text-align: left;
        }

        .header-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
            margin-bottom: 15px;
            font-size: 14px;
            flex-wrap: wrap;
            gap: 5px;
        }

        /* İstasyon Kartları */
        .stations-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 15px;
        }

        .station-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 15px;
            border-radius: 10px;
        }

        .station-card h4 {
            margin: 0 0 8px 0;
            color: var(--m5-purple);
            font-size: 16px;
        }

        /* Durum Rengi Geçişleri: Normal / Yaklaşıyor / Kritik */
        .station-card {
            transition: border-color 0.4s, box-shadow 0.4s;
            border-left: 6px solid #27ae60;
        }

        .station-card .status-label {
            display: inline-block;
            font-size: 11px;
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 10px;
            margin-bottom: 6px;
            background: rgba(39, 174, 96, 0.15);
            color: #27ae60;
        }

        .station-card.status-warning {
            border-left-color: #f39c12;
            box-shadow: 0 0 10px rgba(243, 156, 18, 0.25);
        }
        .station-card.status-warning .status-label {
            background: rgba(243, 156, 18, 0.15);
            color: #f39c12;
        }
        .station-card.status-warning .next-time {
            color: #f39c12;
        }

        .station-card.status-critical {
            border-left-color: #c0392b;
            animation: criticalPulse 1s infinite;
        }
        .station-card.status-critical .status-label {
            background: rgba(192, 57, 43, 0.15);
            color: #c0392b;
        }
        .station-card.status-critical .next-time {
            color: #c0392b;
        }

        @keyframes criticalPulse {
            0%, 100% { box-shadow: 0 0 10px rgba(192, 57, 43, 0.3); }
            50% { box-shadow: 0 0 20px rgba(192, 57, 43, 0.6); }
        }

        .next-time {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
            display: block;
        }

        .all-times {
            font-size: 12px;
            opacity: 0.8;
            line-height: 1.4;
        }

        /* Geri Sayım ve Durum Alanı */
        .countdown-box {
            margin-top: 20px;
            padding: 12px;
            background: rgba(92, 49, 92, 0.08);
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            color: var(--m5-purple);
            font-size: 15px;

        }
        .m5-circle-logo {
            background-color: #6b215c;
            color: #ffffff;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            font-weight: 900;
            letter-spacing: -0.5px;
            flex-shrink: 0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);

        }

        /* Ayarlar Menüsü (Ses & Filtre) */
        .preferences {
            margin-top: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            padding-top: 12px;
            border-top: 1px solid var(--border-color);
            flex-wrap: wrap;
            gap: 10px;
        }

        .preferences select {
            background: var(--panel-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 4px 8px;
            border-radius: 5px;
        }

        .volume-control {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #mute-toggle {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            width: 30px;
            height: 30px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        #volume-slider {
            width: 90px;
            accent-color: var(--m5-purple);
            cursor: pointer;
        }

        /* Alarm Ekranı - Yanıp Sönen Kırmızı Arka Plan */
        #alert-box {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 999;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }

        #alert-box.flashing {
            animation: flashRed 0.7s infinite;
        }

        @keyframes flashRed {
            0%, 100% { background-color: rgba(150, 30, 25, 0.97); }
            50% { background-color: rgba(224, 65, 52, 0.97); }
        }

        /* Derli Toplu Bildirim Kartı */
        .alert-card {
            background: rgba(0, 0, 0, 0.32);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 20px;
            padding: 36px 40px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            color: white;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.35);
        }

        .alert-icon {
            font-size: 48px;
            line-height: 1;
            margin-bottom: 12px;
            animation: iconPulse 1s infinite;
        }

        @keyframes iconPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }

        #alert-message {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 0.3px;
            margin-bottom: 10px;
            line-height: 1.3;
        }

        .alert-subtitle {
            font-size: 14px;
            font-weight: 400;
            opacity: 0.9;
            margin-bottom: 18px;
            line-height: 1.4;
        }

        .alert-countdown {
            font-size: 13px;
            font-weight: 500;
            opacity: 0.85;
            margin-bottom: 22px;
        }

        .alert-countdown span {
            font-weight: 800;
            font-size: 16px;
        }

        #alert-box button {
            padding: 11px 28px;
            font-size: 15px;
            background: white;
            color: #c0392b;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 700;
        }

        @media(max-width: 600px) {
            .stations-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="top-bar">
        <div class="status-badge">
            <div class="pulse-dot"></div> Canlı Takip Ediliyor
        </div>
        <div class="settings-bar">
            <button class="control-btn" onclick="triggerAlarm('ÜSKÜDAR')" style="background-color: #5c315c; color: white;">🔔 Üsküdar Test</button>
            <button class="control-btn" onclick="triggerAlarm('SULTANBEYLİ')" style="background-color: #5c315c; color: white;">🔔 Sultanbeyli Test</button>
            <button class="control-btn" id="theme-toggle">🌙 Koyu Mod</button>
        </div>
    </div>

    <div id="info-panel">
        <div class="header-info">
            <span id="current-date-time">📅 Yükleniyor...</span>
            <span id="day-type-badge" style="font-weight: bold; color: var(--m5-purple);"></span>
        </div>
        <div style="display: flex; align-items: center; gap: 10px;">
            <span class="m5-circle-logo">M5</span>
            <h3 style="margin: 0; font-size: 18px; line-height: 1;">M5 Servis Dışı Durumları</h3> 
        </div>
        <div class="stations-grid">
            <div class="station-card" id="uskudar-card">
                <h4>Üsküdar</h4>
                <span class="status-label" id="uskudar-status">🟢 Normal</span>
                <span class="next-time" id="uskudar-next">Bekleniyor...</span>
                <div class="all-times"><strong>Tüm Saatler:</strong> <span id="uskudar-list"></span></div>
            </div>

            <div class="station-card" id="sultanbeyli-card">
                <h4>Sultanbeyli</h4>
                <span class="status-label" id="sultanbeyli-status">🟢 Normal</span>
                <span class="next-time" id="sultanbeyli-next">Bekleniyor...</span>
                <div class="all-times"><strong>Tüm Saatler:</strong> <span id="sultanbeyli-list"></span></div>
            </div>
        </div>

        <div class="countdown-box" id="countdown-text">
            Sistem aktif ve takip ediliyor.
        </div>

        <div class="preferences">
            <div>
                <label>🔊 Uyarı Sesi Tipi: </label>
                <select id="sound-type">
                    <option value="classic">Çift Ton (Ding-Dong)</option>
                    <option value="soft">Yumuşak Zil</option>
                    <option value="double">Klasik Bip (Çok Uyuz)</option>
                    <option value="alert">Uyarı Zili</option>
                    <option value="gong">Nazik Gong</option>
                </select>
            </div>
            <!-- Varsayılan Ses Emel Olarak Ayarlandı -->
            <div>
                <label>👤 Ses Seçimi: </label>
                <select id="voice-select">
                    <option value="Microsoft Emel" selected>Microsoft Emel (Online Natural)</option>
                    <option value="Microsoft Ahmet">Microsoft Ahmet (Online Natural)</option>
                </select>
            </div>
            <div class="volume-control">
                <label>Ses: </label>
                <button id="mute-toggle" title="Sesi Aç/Kapat">🔊</button>
                <input type="range" id="volume-slider" min="0" max="100" value="70">
            </div>
            <div id="status-working-info"></div>
        </div>
    </div>
</div>

<div id="alert-box">
    <div class="alert-card">
        <div class="alert-icon">🚨</div>
        <div id="alert-message">SERVİS DIŞI</div>
        <div class="alert-subtitle">Servis dışı durumu için trafikçiye sorun.</div>
        <div class="alert-countdown">Otomatik kapanış: <span id="alert-countdown">10</span> sn</div>
        <button onclick="dismissAlert()">Uyarıyı Kapat</button>
    </div>
</div>

<script>
    const scheduleData = {
        weekday: { uskudar: ["08:46", "09:06"], sultanbeyli: ["08:47", "09:13"] },
        saturday: { uskudar: ["20:46", "21:56"], sultanbeyli: ["20:07", "20:56", "22:07"] },
        sunday: { uskudar: ["19:45", "21:53"], sultanbeyli: ["20:09", "22:04"] }
    };

    const dayNames = ["Pazar", "Pazartesi", "Salı", "Çarşamba", "Perşembe", "Cuma", "Cumartesi"];
    function getTodaysSchedule(day) {
        if (day === 0) return scheduleData.sunday;
        if (day === 6) return scheduleData.saturday;
        return scheduleData.weekday;
    }

    if (Notification.permission !== "granted" && Notification.permission !== "denied") Notification.requestPermission();

    let audioCtx = null;
    let alarmActive = false;
    let alarmTimer = null;
    let beepInterval = null;
    let volumeLevel = 70;
    let isMuted = false;

    function getEffectiveVolume() { return isMuted ? 0 : volumeLevel / 100; }

    const toneConfigs = {
        classic: { notes: [{ freq: 587.33, duration: 0.45 }] },
        soft:    { notes: [{ freq: 440, duration: 0.7 }] },
        double:  { notes: [{ freq: 523.25, duration: 0.3 }, { freq: 659.25, duration: 0.45, delay: 0.28 }] },
        alert:   { notes: [{ freq: 783.99, duration: 0.4 }, { freq: 783.99, duration: 0.4, delay: 0.45 }] },
        gong:    { notes: [{ freq: 330, duration: 1.1 }] }
    };

    function playSoftChime() {
        const volume = getEffectiveVolume();
        if (volume <= 0) return;
        try {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const toneKey = document.getElementById('sound-type').value;
            const config = toneConfigs[toneKey] || toneConfigs.classic;
            const peak = 0.15 * volume;
            config.notes.forEach(note => {
                const startTime = audioCtx.currentTime + (note.delay || 0);
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(note.freq, startTime);
                gain.gain.setValueAtTime(0, startTime);
                gain.gain.linearRampToValueAtTime(peak, startTime + 0.04);
                gain.gain.linearRampToValueAtTime(0, startTime + note.duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(startTime);
                osc.stop(startTime + note.duration + 0.05);
            });
        } catch (e) { console.log("Ses çalınamadı: ", e); }
    }

    function speakWarning(text, onEndCallback) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'tr-TR';
            utterance.volume = getEffectiveVolume();
            
            const selectedVoiceName = document.getElementById('voice-select').value;
            const voices = window.speechSynthesis.getVoices();
            
            if (selectedVoiceName) {
                const selectedVoice = voices.find(v => v.name.includes(selectedVoiceName));
                if (selectedVoice) {
                    utterance.voice = selectedVoice;
                }
            }

            if (onEndCallback) {
                utterance.onend = onEndCallback;
                utterance.onerror = onEndCallback;
            }
            window.speechSynthesis.speak(utterance);
        } else if (onEndCallback) {
            onEndCallback();
        }
    }

    window.speechSynthesis.onvoiceschanged = () => {
        console.log("Sesler yüklendi.");
    };

    let countdownInterval = null;
    function alarmCycle(stationName) { speakWarning(stationName + " istasyonu servis dışı", () => { playSoftChime(); }); }
    function startCountdownDisplay(totalSeconds) {
        let remaining = totalSeconds;
        const countdownEl = document.getElementById('alert-countdown');
        if (countdownEl) countdownEl.innerText = remaining;
        if (countdownInterval) clearInterval(countdownInterval);
        countdownInterval = setInterval(() => {
            remaining -= 1;
            if (countdownEl) countdownEl.innerText = Math.max(remaining, 0);
            if (remaining <= 0) clearInterval(countdownInterval);
        }, 1000);
    }

    function triggerAlarm(stationName) {
        if (alarmActive) return;
        alarmActive = true;
        const msg = stationName + " İSTASYONU SERVİS DIŞI!";
        document.getElementById('alert-message').innerText = msg;
        const alertBox = document.getElementById('alert-box');
        alertBox.style.display = 'flex';
        alertBox.classList.add('flashing');
        alarmCycle(stationName);
        beepInterval = setInterval(() => alarmCycle(stationName), 3000);
        startCountdownDisplay(10);
        if ('vibrate' in navigator) navigator.vibrate([200, 100, 200, 100, 200]);
        if (alarmTimer) clearTimeout(alarmTimer);
        alarmTimer = setTimeout(() => { dismissAlert(); }, 10000);
    }

    function dismissAlert() {
        const alertBox = document.getElementById('alert-box');
        alertBox.style.display = 'none';
        alertBox.classList.remove('flashing');
        if (beepInterval) clearInterval(beepInterval);
        if (alarmTimer) clearTimeout(alarmTimer);
        if (countdownInterval) clearInterval(countdownInterval);
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        setTimeout(() => { alarmActive = false; }, 5000);
    }

    function getNextTimeInfo(timesArray, currentTimeStr) {
        let currentMinutes = timeToMinutes(currentTimeStr);
        let futureTimes = timesArray.map(t => ({ time: t, mins: timeToMinutes(t) })).filter(item => item.mins >= currentMinutes);
        return futureTimes.length > 0 ? { next: futureTimes[0].time, diff: futureTimes[0].mins - currentMinutes } : { next: timesArray[0] + " (Yarın)", diff: -1 };
    }

    function timeToMinutes(tStr) { const parts = tStr.split(":"); return parseInt(parts[0]) * 60 + parseInt(parts[1]); }

    function updateCardStatus(cardId, statusId, diff) {
        const card = document.getElementById(cardId);
        const statusLabel = document.getElementById(statusId);
        card.classList.remove('status-warning', 'status-critical');
        if (diff === 0) { card.classList.add('status-critical'); statusLabel.innerText = "🔴 Servis Dışı"; }
        else if (diff > 0 && diff <= 2) { card.classList.add('status-critical'); statusLabel.innerText = "🔴 Kritik (" + diff + " dk)"; }
        else if (diff > 2 && diff <= 10) { card.classList.add('status-warning'); statusLabel.innerText = "🟡 Yaklaşıyor (" + diff + " dk)"; }
        else statusLabel.innerText = "🟢 Normal";
    }

    function updateSystem() {
        const now = new Date();
        const timeStr = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;
        document.getElementById('current-date-time').innerText = `📅 ${now.toLocaleDateString('tr-TR')} | ⏰ ${timeStr}:${now.getSeconds().toString().padStart(2, '0')}`;
        const day = now.getDay();
        document.getElementById('day-type-badge').innerText = (day === 0 || day === 6) ? `🏖️ Hafta Sonu (${dayNames[day]})` : `💼 Hafta İçi (${dayNames[day]})`;
        const todaysSchedule = getTodaysSchedule(day);
        document.getElementById('uskudar-list').innerText = todaysSchedule.uskudar.join(", ");
        document.getElementById('sultanbeyli-list').innerText = todaysSchedule.sultanbeyli.join(", ");
        const uskInfo = getNextTimeInfo(todaysSchedule.uskudar, timeStr);
        const sulInfo = getNextTimeInfo(todaysSchedule.sultanbeyli, timeStr);
        document.getElementById('uskudar-next').innerText = uskInfo.next;
        document.getElementById('sultanbeyli-next').innerText = sulInfo.next;
        updateCardStatus('uskudar-card', 'uskudar-status', uskInfo.diff);
        updateCardStatus('sultanbeyli-card', 'sultanbeyli-status', sulInfo.diff);
        
        // Dinamik durum mesajı güncellemesi
        const countdownBox = document.getElementById('countdown-text');
        if (uskInfo.diff >= 0 && sulInfo.diff >= 0) {
            const minDiff = Math.min(uskInfo.diff, sulInfo.diff);
            countdownBox.innerText = `Sonraki servis dışı duruma yaklaşık ${minDiff} dakika kaldı.`;
        } else {
            countdownBox.innerText = `Bugünkü tüm servis dışı saatleri tamamlandı. Sonraki seferler yarın.`;
        }

        if (!alarmActive) {
            if (todaysSchedule.uskudar.includes(timeStr)) triggerAlarm("ÜSKÜDAR");
            else if (todaysSchedule.sultanbeyli.includes(timeStr)) triggerAlarm("SULTANBEYLİ");
        }
    }

    const themeToggleBtn = document.getElementById('theme-toggle');
    themeToggleBtn.addEventListener('click', () => {
        const htmlElement = document.documentElement;
        if (htmlElement.getAttribute('data-theme') === 'dark') {
            htmlElement.removeAttribute('data-theme');
            themeToggleBtn.innerText = "🌙 Koyu Mod";
        } else {
            htmlElement.setAttribute('data-theme', 'dark');
            themeToggleBtn.innerText = "☀️ Açık Mod";
        }
    });

    const volumeSlider = document.getElementById('volume-slider');
    const muteToggleBtn = document.getElementById('mute-toggle');
    volumeSlider.addEventListener('input', function () {
        volumeLevel = parseInt(this.value, 10);
        if (volumeLevel > 0) isMuted = false;
        muteToggleBtn.innerText = (isMuted || volumeLevel === 0) ? "🔇" : (volumeLevel < 50 ? "🔉" : "🔊");
    });
    muteToggleBtn.addEventListener('click', function () {
        isMuted = !isMuted;
        muteToggleBtn.innerText = (isMuted || volumeLevel === 0) ? "🔇" : (volumeLevel < 50 ? "🔉" : "🔊");
    });

    window.onload = () => { updateSystem(); setInterval(updateSystem, 1000); };
</script>

</body>
</html>
